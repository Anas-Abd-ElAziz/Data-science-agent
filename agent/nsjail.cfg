# nsjail configuration for python_repl sandbox
# Provides kernel-level isolation on top of the Python-level SafetyVisitor.
#
# Usage (from helpers.py):
#   nsjail --config nsjail.cfg --bindmount <sandbox_dir>:/sandbox -- python -I sandbox_runner.py ...

name: "python_repl_sandbox"
description: "Sandbox for LLM-generated data science code"

mode: ONCE
hostname: "sandbox"

# ── Time & Resource Limits ──────────────────────────
time_limit: 25
rlimit_as_type: HARD
rlimit_as: 512
rlimit_cpu_type: HARD
rlimit_cpu: 25
rlimit_fsize_type: HARD
rlimit_fsize: 10
rlimit_nofile_type: HARD
rlimit_nofile: 64
max_cpus: 1

# ── Namespace Isolation ─────────────────────────────
clone_newnet: true
clone_newpid: true
clone_newuser: true
clone_newns: true
clone_newipc: true
clone_newuts: true

# ── Filesystem Mounts ───────────────────────────────
# Read-only system directories
mount {
    src: "/usr"
    dst: "/usr"
    is_bind: true
    rw: false
}
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
    mandatory: false
}
mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    rw: false
}
mount {
    src: "/sbin"
    dst: "/sbin"
    is_bind: true
    rw: false
    mandatory: false
}

# Python installation (read-only)
mount {
    src: "/usr/local"
    dst: "/usr/local"
    is_bind: true
    rw: false
}

# /proc is required by the Python runtime
mount {
    fstype: "proc"
    dst: "/proc"
}

# Minimal /dev
mount {
    fstype: "tmpfs"
    dst: "/dev"
    rw: false
}

# /tmp writable (Python tempfile support)
mount {
    fstype: "tmpfs"
    dst: "/tmp"
    rw: true
    options: "size=10485760"
}

# Sandbox working directory is the ONLY persistent writable mount.
# Bound dynamically via CLI: --bindmount <host_dir>:/sandbox
cwd: "/sandbox"

# Silence nsjail's own log output (stderr)
log_level: 3
